[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[eventlistener:service-failure]
command=python3 /usr/local/bin/supervisor-watchdog.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
priority=1
buffer_size=100
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm -F
priority=10
startretries=0
stopasgroup=true
killasgroup=true
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
startretries=0
stopasgroup=true
killasgroup=true
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=php /app/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/app
user=www-data
priority=30
startretries=0
stopwaitsecs=90
stopasgroup=true
killasgroup=true
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
