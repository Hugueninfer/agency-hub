name: agency-hub
services:
  app:
    build: .
    image: agency-hub:local
    ports:
      - "127.0.0.1:8080:80"
    environment:
      APP_NAME: Agency Hub
      APP_ENV: local
      APP_DEBUG: "false"
      # Public, local-only key. Never use this Compose configuration in production.
      APP_KEY: "base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE="
      APP_MODE: combined
      APP_URL: http://127.0.0.1:8080
      ASSET_URL: http://127.0.0.1:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: agency_hub
      DB_USERNAME: agency_hub
      DB_PASSWORD: local-only-agency-hub
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"
      SECURITY_HSTS_ENABLED: "false"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:8080
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:8080
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: public
      API_DOCS_ENABLED: "false"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
    volumes:
      - uploads:/app/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
    environment:
      MYSQL_DATABASE: agency_hub
      MYSQL_USER: agency_hub
      MYSQL_PASSWORD: local-only-agency-hub
      MYSQL_ROOT_PASSWORD: local-only-mysql-root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  uploads:
  mysql-data:
