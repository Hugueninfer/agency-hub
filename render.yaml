# Schema: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: agency-hub
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 100
    envVars:
      - fromGroup: agency-hub-runtime
      # Render generation cannot add Laravel's required base64: prefix.
      - key: APP_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AIVEN_CA_CERT
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /tmp/agency-hub-aiven-ca.pem

envVarGroups:
  - name: agency-hub-runtime
    envVars:
      - key: APP_NAME
        value: Agency Hub
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_MODE
        value: combined
      - key: TRUSTED_PROXIES
        value: "*"
      - key: APP_URL
        value: https://agency-hub.onrender.com
      - key: ASSET_URL
        value: https://agency-hub.onrender.com
      - key: DB_CONNECTION
        value: mysql
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SECURITY_HSTS_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://agency-hub.onrender.com
      - key: SANCTUM_STATEFUL_DOMAINS
        value: agency-hub.onrender.com
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: DEMO_TTL_HOURS
        value: "24"
      - key: DEMO_MAX_ACTIVE
        value: "100"
      - key: DEMO_MAX_WRITES
        value: "5000"
      - key: API_DOCS_ENABLED
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
